[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-audio-transcriber"
version = "0.1.0"
description = "从视频链接提取音频转录的 CLI 工具（支持抖音、B站）"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
video-audio-transcriber = "video_audio_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
